cf.campaign.minWinnerSupport=5
cf.campaign.seed.input=
cf.campaign.seed.output=
cf.analysis.front=nsga-ii
cf.random.seed=1
cf.order.deterministic=true
cf.checkpoint.enabled=false
cf.checkpoint.file=
cf.artifacts.enabled=false
cf.ui.enabled=false

# Revision 2: planning switches approved from existing PlanOptions.
cf.plan.autoGenerateMissingSheets=true
cf.plan.virtualSheetPrefix=FW_VIRTUAL_
cf.plan.headlessRowsGetTarget=true
cf.plan.nestedJoinersEnabled=true
cf.plan.autoPromoteSingleVerb=true
cf.plan.autoGenerateSheetNames=true

# Supplement to revision 2 (architect reply of 2026-10-01): generation switches, decisions G6 and G7.
cf.generation.library=PARALLEL
cf.generation.distinctTables=false
cf.generation.emptyStagePolicy=PRESERVE_EMPTY
cf.generation.replace.pattern=permissive
cf.generation.replace.unmatched=ignore
cf.generation.replace.unparseable=warn
cf.generation.replace.identity=allow
cf.generation.replace.diagnostics=off

# Work package M03: candidate assembly, optional sheets, rendering, constraints and covering selection.
cf.assembly.distinct=false
cf.assembly.mandatoryLimit=9223372036854775807
cf.optional.mode=auto
cf.optional.includeAbsent=true
cf.optional.sizes=all
cf.optional.producedSizes=all
cf.optional.subsetRowLimit=9223372036854775807
cf.render.concatenator=
cf.render.sheetConcatenator=apply
cf.render.preserveWhitespace=false
cf.render.spaceBefore=
cf.render.spaceAfter=
cf.render.newlineBefore=
cf.render.newlineAfter=
cf.render.markerReplacement=true
cf.constraints.file=
cf.constraints.bondsFile=
cf.coverage.strength=0
cf.coverage.method=greedy
cf.coverage.budget=0
cf.coverage.hardCap=2000000
