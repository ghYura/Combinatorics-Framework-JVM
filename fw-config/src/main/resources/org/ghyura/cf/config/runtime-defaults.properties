# Proposed Java runtime defaults; target implementation must validate every property.
cf.schema.version=1
cf.java.release=25
cf.runtime.mode=single-jvm
cf.storage.mode=heap
cf.keys.encoding=AUTO_PRESERVE
cf.keys.logical.labels=preserve
cf.keys.window.scope=all
cf.execution.mode=trusted-cooperative
cf.execution.workers=4
cf.execution.repeat.count=1
cf.execution.retry.maxAttempts=1
cf.execution.timeout.millis=30000
cf.execution.cancel.grace.millis=2000
cf.execution.output.maxBytes=1048576
cf.run.id=run
cf.execution.sut=generated-java
cf.execution.classpath=
cf.python.executable=python3
cf.python.path=
cf.python.env=
cf.python.workdir=
cf.python.sandbox=
cf.execution.verdict=FW_VAR
cf.execution.environments=
cf.execution.repeat.policy=local
cf.execution.repeat.scope=all
cf.execution.serialize=false
cf.execution.coverage=none
cf.run.budget.millis=0
cf.run.stop.candidates=0
cf.run.stop.errors=0
cf.run.stop.target=
cf.pipeline.queue.maxItems=256
cf.pipeline.queue.maxBytes=16777216
cf.pipeline.ordinal.window=256
cf.pipeline.listener.maxAttempts=3
cf.memory.budget.bytes=268435456
cf.memory.exhaustion=fail-explicitly
cf.results.retention=full
cf.results.maxSamples=100000
cf.results.maxAttachmentBytes=16777216
