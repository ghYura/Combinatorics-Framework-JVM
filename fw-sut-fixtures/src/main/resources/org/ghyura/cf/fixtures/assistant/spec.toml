title = "Local app2/app3 text assistant — independent controls"
goals = ["prompt_tokens", "completion_tokens", "total_tokens"]
args = ["mode=local_assistant"]

[[slots]]
sheet = "CHAT"
key = "chat"
verb = "FW_Combi(1)"
raw = true
values = [
'''
{"max_tokens": null, "messages": [{"content": "calculate 2*(4+5)", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "2^3^2", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "WHO ARE YOU", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "help", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "кто ты", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "predict 1 2 3", "role": "user"}]}
''',
'''
{"max_tokens": 4, "messages": [{"content": "who are you", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "calculate 1/3", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "  ", "role": "user"}, {"content": "", "role": "system"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "help", "role": " ASSISTANT "}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "calculate -2**2", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "calculate 2**-2", "role": "user"}]}
''',
'''
{"max_tokens": null, "messages": [{"content": "calculate 2^3^2", "role": "user"}]}
''',
]
