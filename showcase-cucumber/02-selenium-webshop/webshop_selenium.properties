# Settings of webshop_selenium.json. The command line reads them with --config; Showcase.java passes them and adds
# cf.execution.classpath (the glue in target/test-classes and the jars in target/lib), which depends on where the folder is.
cf.run.id=webshop_selenium_r1
cf.keys.encoding=SIGNED_BYTE
cf.render.preserveWhitespace=true
# Pairwise covers only the six static parameters. The cart actions (FW_Optional + rule actions_always) and the two sudden
# events (FW_Optional) stay out of the selection: every kept row runs all 6 orders, each with no, one or both sudden events
# striking after every action.
cf.coverage.strength=2
cf.coverage.method=set-cover
# each test case starts its own headless Firefox: four at a time
cf.execution.workers=4
cf.execution.timeout.millis=120000
cf.execution.cancel.grace.millis=10000
cf.run.stop.errors=15
cf.results.attach=failed
cf.analysis.enabled=true
cf.analysis.goals=browser_ms:min
cf.analysis.discover=false
cf.random.seed=11
