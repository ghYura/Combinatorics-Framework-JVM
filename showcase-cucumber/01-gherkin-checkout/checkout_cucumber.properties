# Settings of checkout_cucumber.json. The command line reads them with --config; Showcase.java passes them and adds
# cf.execution.classpath (the glue in target/test-classes and the jars in target/lib), which depends on where the folder is.
cf.run.id=checkout_cucumber_r1
# growing beyond 127 labels fails loudly instead of widening the keys
cf.keys.encoding=SIGNED_BYTE
# values are rendered as written: the Java keeps its lines, and the FW_File fragment keeps its Gherkin layout
cf.render.preserveWhitespace=true
# Pairwise covers only the four static parameters. The action sequence (FW_Optional + rule steps_always) and the two
# sudden events (FW_Optional) stay out of the selection: every kept row runs all 24 orders, each with no, one or both
# sudden events striking after every action.
cf.coverage.strength=2
cf.coverage.method=set-cover
cf.execution.workers=4
cf.execution.timeout.millis=60000
# a harness that breaks stops the run early instead of breaking every test case
cf.run.stop.errors=25
cf.results.attach=failed
cf.analysis.enabled=true
cf.analysis.goals=total_eur:min
cf.analysis.discover=false
cf.random.seed=7
