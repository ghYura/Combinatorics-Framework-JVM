# Settings of the showcase scenario (showcase.xlsx). ./cf.sh applies a scenario's companion <stem>.properties when the
# command line names no --config; the application reads it with --config FILE.

# The run's name in every sample key.
cf.run.id=showcase

# Pairwise covering: keep only orders that try a pair of values not tried yet, until every feasible pair of values of
# any two sheets is in (the constraints decide what is feasible). 2 is pairwise, 3 every triple; 0 runs the whole space.
cf.coverage.strength=2
cf.coverage.method=set-cover

# Analyse the run: the fastest and the cheapest orders, and what distinguishes the failures.
cf.analysis.enabled=true
cf.analysis.goals=latency_ms:min,total_eur:min
cf.analysis.discover=false
